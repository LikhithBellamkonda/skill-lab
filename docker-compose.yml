services:
  mongo:
    image: mongo:8
    container_name: skill-lab-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - skill-lab-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  skill-lab-mongo-data:
