# Render Blueprint — one-click provisioning of the API.
#
# Usage: Render dashboard -> New -> Blueprint -> select this repository.
# Render reads this file, creates the web service, and prompts for the two
# secret values marked `sync: false` (DATABASE_URL and CLIENT_ORIGIN).
#
# The frontend is NOT defined here: it is deployed as a static site on Vercel
# (see docs/deployment.md), because Vercel serves static assets from its CDN and
# does not sleep.
services:
  - type: web
    name: smart-lost-found-api
    runtime: node
    plan: free
    # Pick the region closest to your MongoDB Atlas cluster to reduce query latency.
    region: oregon
    buildCommand: npm ci
    # Root `npm start` runs `npm run start --workspace server` (no watch mode).
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'

      # MongoDB Atlas connection string. Set this in the dashboard; never commit it.
      - key: DATABASE_URL
        sync: false

      - key: MONGO_MAX_POOL_SIZE
        value: '5'

      # Render generates a strong value automatically for this deployment.
      - key: JWT_SECRET
        generateValue: true

      # Your Vercel URL, e.g. https://smart-lost-found.vercel.app
      # No trailing slash. Required for browser requests to be accepted.
      - key: CLIENT_ORIGIN
        sync: false

      # Deterministic matching only; no external AI calls.
      - key: AI_PROVIDER
        value: disabled

      # Render's filesystem is ephemeral. Uploads can be lost on redeploy/restart.
      - key: UPLOAD_DIR
        value: /tmp/uploads
